[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lprts"
version = "0.5.0"
description = "LPR-RTS - Reconhecimento de placas veiculares em tempo real com IA/ML (prova de conceito para pesquisa de doutorado)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Thiago G. Traue" }]
keywords = ["alpr", "lpr", "anpr", "license-plate", "computer-vision", "real-time", "yolo", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# Dependencias minimas: o nucleo do pipeline roda apenas com numpy + opencv.
# Detectores neurais e OCR profundo sao "extras" (ver [project.optional-dependencies]).
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Interface grafica desktop (Qt6)
ui = ["PySide6>=6.6", "pyqtgraph>=0.13"]

# Deteccao neural + treino (Apple Silicon: MPS/CoreML)
dl = [
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  # Exportacao para .mlpackage (Neural Engine). O ultralytics exige numpy<=2.3.5
  # na exportacao e, se achar outro, troca o numpy do ambiente sozinho.
  "coremltools>=8.0; sys_platform == 'darwin'",
  "numpy<=2.3.5; sys_platform == 'darwin'",
]

# Motores de OCR profundo (escolha um ou mais).
# fast-plate-ocr >= 1.0: API list[PlatePrediction] usada pelo adaptador.
ocr = ["fast-plate-ocr>=1.0", "easyocr>=1.7"]
# PaddleOCR 3.x mudou a API (use_gpu, show_log, det/cls): o adaptador e para 2.x.
paddle = ["paddlepaddle>=2.6,<3", "paddleocr>=2.8,<3"]

# Analise de dados / exportacao cientifica
analysis = ["pandas>=2.2", "pyarrow>=15", "duckdb>=1.0", "matplotlib>=3.8", "scipy>=1.12"]

dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

all = ["lprts[ui,dl,ocr,analysis,dev]"]

[project.scripts]
lprts = "lprts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lprts = ["py.typed", "analytics/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: testes que exigem modelos neurais ou video real",
  "gui: testes que exigem PySide6 e display",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # comprimento de linha: o formatador ja cuida disso
  "B008",    # chamada em argumento padrao: e o idioma do typer
  # SIM103 quer "return not (cond)" no lugar de guard clauses. Varias funcoes
  # aqui sao sequencias de condicoes de saida, cada uma com um comentario
  # explicando por que rejeita. Inlinar produz dupla negacao e perde o
  # comentario - o codigo fica mais curto e menos legivel.
  "SIM103",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
